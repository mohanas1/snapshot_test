<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CG Monitor Log</title>
  <style>
    :root {
      --bg-main: #f6f8fb;
      --card-bg: #ffffff;
      --text-primary: #1f2937;
      --text-muted: #6b7280;
      --border-gray: #e5e7eb;
      --primary-blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border-gray); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    h1 { margin: 0 0 0.4rem; font-size: 1.35rem; }
    .meta { color: var(--text-muted); font-size: 0.9rem; margin: 0.15rem 0; }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
    .btn { border: 1px solid #d1d5db; border-radius: 8px; padding: 0.45rem 0.75rem; text-decoration: none; color: #111827; background: #f9fafb; font-size: 0.9rem; font-weight: 600; }
    .btn.primary { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0f172a; color: #e5e7eb; border-radius: 10px; padding: 1rem; margin: 0; max-height: 76vh; overflow: auto; font-size: 0.82rem; line-height: 1.35; }
    code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.14rem 0.35rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>CG Monitor Run Log</h1>
      <p class="meta">Run ID: <code>{{ run_id }}</code></p>
      <p class="meta">PC IP: <code>{{ row.get('pc_ip', '-') }}</code> | Status: <code>{{ row.get('status', '-') }}</code></p>
      <p class="meta">Started: {{ row.get('started_at', '-') }} | Finished: {{ row.get('finished_at', '-') }}</p>
      <p class="meta">Log path: <code>{{ row.get('log_path', '-') }}</code></p>
      <div class="actions">
        <a class="btn" href="{{ url_for('cg_reports') }}">Back to CG</a>
        <a class="btn primary" href="{{ download_url }}">Download log</a>
      </div>
    </div>
    <div class="card">
      <pre>{{ log_text }}</pre>
    </div>
  </div>
</body>
</html>
